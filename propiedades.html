<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Propiedades | Robledo Propiedades</title>

<link rel="stylesheet" href="css/estilos.css">

</head>

<body>

<header>

<img src="logo.png" alt="Robledo Propiedades">

<nav>

<a href="index.html">Inicio</a>

<a href="propiedades.html">Propiedades</a>

<a href="nosotros.html">Nosotros</a>

<a href="contacto.html">Contacto</a>

</nav>

</header>


<main>

<section class="titulo-propiedades">

<h1>
Propiedades
</h1>

<p>
Encontrá la propiedad que estás buscando.
</p>

</section>


<section class="filtros">

<h2>
Buscá tu propiedad
</h2>

<div class="filtros-grid">

<div class="campo">

<label for="operacion">
Operación
</label>

<select id="operacion">

<option>Comprar o alquilar</option>
<option>Comprar</option>
<option>Alquilar</option>

</select>

</div>


<div class="campo">

<label for="tipo-propiedad">
Tipo de propiedad
</label>

<select id="tipo-propiedad">

<option>Todos</option>
<option>Casa</option>
<option>Departamento</option>
<option>PH</option>
<option>Terreno</option>
<option>Local</option>
<option>Oficina</option>

</select>

</div>


<div class="campo">

<label for="ubicacion-propiedad">
Ubicación
</label>

<input
type="text"
id="ubicacion-propiedad"
placeholder="Ej. La Plata"
>

</div>


<div class="campo">

<label for="precio-minimo">
Precio mínimo
</label>

<input
type="number"
id="precio-minimo"
placeholder="Desde"
>

</div>


<div class="campo">

<label for="precio-maximo">
Precio máximo
</label>

<input
type="number"
id="precio-maximo"
placeholder="Hasta"
>

</div>


<div class="campo">

<label for="dormitorios">
Dormitorios
</label>

<select id="dormitorios">

<option>Cualquier cantidad</option>
<option>1+</option>
<option>2+</option>
<option>3+</option>
<option>4+</option>

</select>

</div>


<div class="campo">

<label for="banos">
Baños
</label>

<select id="banos">

<option>Cualquier cantidad</option>
<option>1+</option>
<option>2+</option>
<option>3+</option>

</select>

</div>


<div class="campo">

<label for="cochera">
Cochera
</label>

<select id="cochera">

<option>Indistinto</option>
<option>Sí</option>
<option>No</option>

</select>

</div>

</div>


<button
type="button"
class="btn-buscar"
id="btn-buscar"
>
Buscar propiedades
</button>

</section>


<section class="resultados">

<div class="resultados-titulo">

<h2>
Propiedades disponibles
</h2>

<p>
Encontrá opciones que se adapten a vos.
</p>

</div>


<div class="propiedades-grid" id="propiedades-container">
</div>

</section>

</main>


<footer>

<h3>
Robledo Propiedades
</h3>

<p>
Compra · Venta · Alquiler
</p>

<p>
Todos los derechos reservados.
</p>

</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="propiedades.js"></script>
</body>

</html>
